name: Freemchost Auto Renew Permanent

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write # 👈 必须添加此行，允许更新 workflow 本身

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装基础工具与依赖
        run: |
          sudo apt-get update -y && sudo apt-get install -y netcat-openbsd
          npm init -y
          npm install playwright js-yaml
          npx playwright install chromium --with-deps

      - name: ⚙️ 部署 Mihomo 代理内核
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "$NODE_LINK" > node.txt
          python3 -m http.server 8080 &
          wget -qO sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xf sub.tar.gz
          nohup ./subconverter/subconverter > sub.log 2>&1 &
          sleep 2
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz
          gunzip mihomo.gz
          chmod +x mihomo
          cat << 'EOF' > parse_node.js
          const fs = require('fs');
          const http = require('http');
          const url = require('url');
          const yaml = require('js-yaml');
          const nodeLink = (process.env.NODE_LINK || '').trim();
          async function trySubconverter() {
            return new Promise((resolve) => {
              http.get('http://127.0.0.1:25500/sub?target=clash&url=http://127.0.0.1:8080/node.txt&insert=false', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data.includes('proxies:') && data.includes('name:') ? data : null));
              }).on('error', () => resolve(null));
            });
          }
          function parseRawLink(link) {
            link = link.trim();
            if (link.startsWith('socks5://') || link.startsWith('socks://')) {
              const u = new url.URL(link);
              return { name: 'node', type: 'socks5', server: u.hostname, port: parseInt(u.port || '1080'), username: u.username || '', password: u.password || '' };
            }
            if (link.startsWith('vless://')) {
              const u = new url.URL(link);
              const sec = u.searchParams.get('security') || '';
              const n = { name: 'node', type: 'vless', server: u.hostname, port: parseInt(u.port || '443'), uuid: u.username, tls: ['tls', 'reality'].includes(sec), network: u.searchParams.get('type') || 'tcp' };
              if (u.searchParams.get('sni')) n.servername = u.searchParams.get('sni');
              if (sec === 'reality') n['reality-opts'] = { 'public-key': u.searchParams.get('pbk') || '' };
              return n;
            }
            return null;
          }
          (async () => {
            const subRes = await trySubconverter();
            if (subRes) {
              fs.writeFileSync('config.yaml', 'socks-port: 7891\nallow-lan: true\nmode: global\n' + subRes);
            } else {
              const nodeObj = parseRawLink(nodeLink);
              fs.writeFileSync('config.yaml', yaml.dump({ 'socks-port': 7891, 'allow-lan': true, 'mode': 'global', 'proxies': [ nodeObj ] }));
            }
          })();
          EOF
          node parse_node.js
          nohup ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          sleep 3
          nc -z 127.0.0.1 7891

      - name: 执行自动化动态续期
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL != '' && secrets.PROXY_URL || (env.NODE_LINK != '' && 'socks5://127.0.0.1:7891' || '') }}
        run: node renew.js

      - name: 🔄 同步下一次动态执行计划
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/freemchost.yml ] && ! git diff --quiet .github/workflows/freemchost.yml; then
            echo "📅 发现新的动态 Cron 调度计划，正在同步至仓库..."
            git add .github/workflows/freemchost.yml
            git commit -m "chore: 动态更新下一次执行计划 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "计划未变动或无需调整，跳过提交。"
          fi

      - name: 上传现场截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
